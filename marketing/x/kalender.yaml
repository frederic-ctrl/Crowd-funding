# Contentkalender voor X (Marketing Scan en Marketing Scan Genesis).
#
# Zo werkt het:
# - Elke post heeft een id, een moment (met tijdzone), een categorie, een status en de tekst.
# - Taal: posts zijn Engels (defaultLang "en" in config.json). Een Nederlandse post krijgt "lang: nl".
#   De verplichte vermeldingen moeten in de taal van de post staan; de verboden woorden gelden in beide talen.
# - Placeholders: {site} = community-site, {scan} = marketingscan.be (Engels: /en), {genesis} = {site}/genesis,
#   {transparantie} = {site}/transparantie, {steun} = {site}/steun, {voorwaarden} = offer.voorwaardenUrl uit config.json.
#   {site}, {genesis}, {transparantie} en {voorwaarden} krijgen automatisch ?lang=en of ?lang=nl,
#   zodat de site in de taal van de post opent. {scan} blijft zoals hij is.
# - Categorieën:
#     product        over de scan zelf. Mag niet over Genesis, passes, wallets of de voorverkoop gaan.
#     genesis        over de Genesis Pass, de prijsladder, de Genesis-muur en de roadmap.
#     uitleg         hoe het werkt: wallet, soulbound, geld terug, de demo.
#     transparantie  cijfers en stand van zaken.
#     verkoop        directe koopoproepen. Kan pas als de verkoop live is (verkoopActief en legalReviewDone).
#     steun          oproep tot een gift in crypto via de steunpagina ({steun}). Vermeldt letterlijk
#                    "A gift, nothing in return" en "Not an investment"; linkt naar {steun} of zegt "Link in bio".
# - Elke post in genesis, uitleg, transparantie en verkoop vermeldt letterlijk "Not an investment"
#   (Nederlands: "Geen investering"). Zolang de verkoop niet live is ook "Not on sale yet"
#   (Nederlands: "Nog geen verkoop"), en geen koopoproepen ("buy now", "claim your pass", "koop nu", ...).
# - Engels: schrijf nooit "presale" (klinkt als een token sale). Zeg "early access" of "founding members".
# - Status "concept" wordt nooit gepost. Goedkeuren gebeurt via GitHub: Actions > "X: post goedkeuren".
#   De goedkeuring is gekoppeld aan de exacte tekst: pas je de tekst nadien aan, dan vervalt ze.
# - Lengte: max 280 tekens, een link telt als 23. Een post met link kost $0.20, zonder link $0.015.
# - Afbeelding (optioneel): "afbeelding: media/naam.png" (png, jpg, gif of webp, max 5 MB, in marketing/x/media).
#   De goedkeuring hangt ook aan de afbeelding. Zonder afbeelding toont X bij een link de linkkaart van die pagina.
# - Test (optioneel): "test: <naam>" en "variant: <naam>". De workflow "X: resultaten ophalen" haalt elke
#   avond weergaven en linkklikken van testposts op (state/statistieken.json), aan $0.005 per post.
# - Engelse posts staan om 15:00 (Brussel): dan lezen Europa en de Amerikaanse oostkust allebei mee.
#   De dagelijkse routine voegt elke dag drie Engelse posts toe, om 10:00, 15:00 en 20:00 (max 3 per dag).

