# Sjablonen worden elke week automatisch ingevuld met de cijfers uit data/cijfers.json.
# Ze posten enkel als die cijfers de voorbije 8 dagen bijgewerkt zijn ("bijgewerkt" in cijfers.json).
# Variabelen: {week}, {passes}, {agency}, {supporters}, {opgehaald}, {gebruikers}, {wachtlijst}, {stand}.
# Een sjabloon heeft een tekst per taal. "lang" kiest welke gepost wordt (beide worden gecontroleerd).
# Cijfers volgen de notatie van de taal: Engels 1,234 en €12,345.50, Nederlands 1.234 en €12.345,50.
# {stand} komt uit "stand" in cijfers.json: { "en": "...", "nl": "..." }.
sjablonen:
  - id: transparantie-wekelijks
    categorie: transparantie
    elke: maandag
    om: "15:00"
    status: concept
    lang: en # zet op nl om de Nederlandse tekst te posten (keur daarna opnieuw goed)
    tekst:
      en: |-
        Genesis update, week {week}: {passes}/250 passes, {agency}/25 agency passes, {supporters} supporters, €{opgehaald} of €50,000. Marketing Scan has {gebruikers} weekly users. Status: {stand}.

        Not an investment. Not on sale yet.
        {transparantie}
      nl: |-
        Genesis-update week {week}: {passes}/250 passes, {agency}/25 agency-passes, {supporters} supporters en €{opgehaald} van €50.000. Marketing Scan telt {gebruikers} wekelijkse gebruikers. Stand: {stand}.

        Geen investering. Nog geen verkoop.
        {transparantie}
