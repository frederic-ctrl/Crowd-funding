# Contentkalender voor X (Marketing Scan en Marketing Scan Genesis).
#
# Zo werkt het:
# - Elke post heeft een id, een moment (met tijdzone), een categorie, een status en de tekst.
# - Placeholders: {site} = community-site, {scan} = marketingscan.be, {genesis} = {site}/genesis,
#   {transparantie} = {site}/transparantie, {voorwaarden} = offer.voorwaardenUrl uit config.json.
# - Categorieën:
#     product        over de scan zelf. Mag niet over Genesis, passes, wallets of de voorverkoop gaan.
#     genesis        over de Genesis Pass, de voorverkoop, de prijsladder en de Genesis-muur.
#     uitleg         hoe het werkt: wallet, soulbound, geld terug, transparantie.
#     transparantie  cijfers en stand van zaken.
#     verkoop        directe koopoproepen. Kan pas als de verkoop live is (verkoopActief en legalReviewDone).
# - Elke post in genesis, uitleg, transparantie en verkoop vermeldt letterlijk "Geen investering".
#   Zolang de verkoop niet live is ook "Nog geen verkoop", en geen koopoproepen ("koop nu", "claim je pass", ...).
# - Status "concept" wordt nooit gepost. Goedkeuren gebeurt via GitHub: Actions > "X: post goedkeuren".
#   De goedkeuring is gekoppeld aan de exacte tekst: pas je de tekst nadien aan, dan vervalt ze.
# - Lengte: max 280 tekens, een link telt als 23. Een post met link kost $0.20, zonder link $0.015.

posts:
  - id: 2026-10-27-gratis-scan
    moment: 2026-10-27T10:00:00+01:00
    categorie: product
    status: concept
    tekst: |-
      Hoe zichtbaar is jouw bedrijf écht online? Marketing Scan checkt je website, Google, reviews, social media, tracking, e-mail en beveiliging. Meer dan 30 controlepunten, resultaat in 60 seconden. Gratis, zonder account.

      {scan}

  - id: 2026-10-29-waarom-genesis
    moment: 2026-10-29T10:00:00+01:00
    categorie: genesis
    status: concept
    tekst: |-
      Eerlijk over waar we staan: Marketing Scan heeft een tiental wekelijkse gebruikers en nog geen betalende klant. Om sneller te bouwen, werken we aan Marketing Scan Genesis: 250 genummerde passes voor levenslang Pro.

      Geen investering. Nog geen verkoop. {genesis}

  - id: 2026-11-03-google-bedrijfsprofiel
    moment: 2026-11-03T10:00:00+01:00
    categorie: product
    status: concept
    tekst: |-
      Je Google Bedrijfsprofiel is vaak het eerste wat een klant van je ziet. Kloppen je openingsuren, foto's en reviews? Marketing Scan checkt het mee in je gratis scan.

      {scan}

  - id: 2026-11-05-prijsladder
    moment: 2026-11-05T10:00:00+01:00
    categorie: genesis
    status: concept
    tekst: |-
      De Genesis Pass heeft een vaste prijsladder. De prijs stijgt per 50 verkochte passes: #001 tot #050 kost €99, daarna €149, €199, €249 en €299. Vroeger instappen is goedkoper, en je prijs ligt vast bij je nummer.

      Geen investering. Nog geen verkoop. {genesis}

  - id: 2026-11-10-soulbound
    moment: 2026-11-10T10:00:00+01:00
    categorie: uitleg
    status: concept
    tekst: |-
      Je Genesis Pass is soulbound: een token op Solana dat vastzit aan je wallet. Je pass is van jou en niet verhandelbaar, dus geen speculatie. Het is gewoon je bewijs van levenslang Marketing Scan Pro.

      Geen investering. Nog geen verkoop.

  - id: 2026-11-12-correct-voor-snel
    moment: 2026-11-12T10:00:00+01:00
    categorie: transparantie
    status: concept
    tekst: |-
      Waarom de verkoop nog niet open is: de boekhouder beslist eerst of Marketing Scan een eenmanszaak blijft of een BV wordt. Liever correct dan snel. Tot dan draait Genesis enkel als demo op het Solana-testnet.

      Geen investering. Nog geen verkoop.

  - id: 2026-11-17-ai-zichtbaarheid
    moment: 2026-11-17T10:00:00+01:00
    categorie: product
    status: concept
    tekst: |-
      Noemen ChatGPT, Gemini en Perplexity jouw bedrijf als iemand een aanrader zoekt? Marketing Scan checkt ook je zichtbaarheid in AI-assistenten. Gratis, resultaat in 60 seconden.

      {scan}

  - id: 2026-11-19-geld-terug
    moment: 2026-11-19T10:00:00+01:00
    categorie: uitleg
    status: concept
    tekst: |-
      Van gedacht veranderd? Tot 14 dagen na je Genesis Pass krijg je je geld terug met één klik. Je pass wordt verbrand en het geld gaat terug in dezelfde transactie, publiek zichtbaar op Solana.

      Geen investering. Nog geen verkoop.

  - id: 2026-11-24-elke-euro-zichtbaar
    moment: 2026-11-24T10:00:00+01:00
    categorie: transparantie
    status: concept
    tekst: |-
      Elke euro van Marketing Scan Genesis staat publiek op Solana: elke pass, elke terugbetaling en elke opname uit de kas. Je hoeft ons niet op ons woord te geloven, je kan alles zelf nakijken.

      Geen investering. Nog geen verkoop. {transparantie}

  - id: 2026-11-26-genesis-agency
    moment: 2026-11-26T10:00:00+01:00
    categorie: genesis
    status: concept
    tekst: |-
      Voor bureaus en freelancers met meerdere klanten: Genesis Agency geeft levenslang Marketing Scan Pro voor tot 10 websites. 25 genummerde passes, #01 tot #25, aan €799, met support rechtstreeks bij de oprichter.

      Geen investering. Nog geen verkoop. {genesis}

  - id: 2026-12-01-snelle-website
    moment: 2026-12-01T10:00:00+01:00
    categorie: product
    status: concept
    tekst: |-
      Een trage website kost je klanten nog voor ze zien wat je doet. Marketing Scan meet de snelheid van je site en zegt wat je eerst moet aanpakken. Gratis, resultaat in 60 seconden.

      {scan}

  - id: 2026-12-03-supporter-muur
    moment: 2026-12-03T10:00:00+01:00
    categorie: genesis
    status: concept
    tekst: |-
      Mee bouwen kan ook zonder abonnement. Als Supporter steun je Marketing Scan vanaf €1: je krijgt een supporter-badge in je wallet en je naam op de Genesis-muur, naast iedereen met een pass.

      Geen investering. Nog geen verkoop. {genesis}

  - id: 2026-12-08-roadmap
    moment: 2026-12-08T10:00:00+01:00
    categorie: genesis
    status: concept
    tekst: |-
      Wat er na de scan komt: een SEO-suite, mailings en social posting. Met een Genesis Pass krijg je elke nieuwe Pro-functie zonder meerprijs, en stem je mee over de volgorde waarin we ze bouwen.

      Geen investering. Nog geen verkoop. {genesis}

  - id: 2026-12-10-demo-testnet
    moment: 2026-12-10T10:00:00+01:00
    categorie: uitleg
    status: concept
    tekst: |-
      Probeer Marketing Scan Genesis nu al uit op het Solana-testnet: verbind je wallet, haal test-euro op en maak een testpass aan. Zonder echt geld, zodat je precies ziet hoe het werkt.

      Geen investering. Nog geen verkoop. {genesis}

# Sjablonen worden elke week automatisch ingevuld met de cijfers uit data/cijfers.json.
# Ze posten enkel als die cijfers de voorbije 8 dagen bijgewerkt zijn ("bijgewerkt" in cijfers.json).
# Variabelen: {week}, {passes}, {agency}, {supporters}, {opgehaald}, {gebruikers}, {wachtlijst}, {stand}.
sjablonen:
  - id: transparantie-wekelijks
    categorie: transparantie
    elke: maandag
    om: "10:00"
    status: concept
    tekst: |-
      Genesis-update week {week}: {passes}/250 passes, {agency}/25 agency-passes, {supporters} supporters en €{opgehaald} van €50.000. Marketing Scan telt {gebruikers} wekelijkse gebruikers. Stand: {stand}.

      Geen investering. Nog geen verkoop. {transparantie}
