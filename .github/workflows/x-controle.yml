name: "X: controle"

# Draait bij elke push en pull request: tests, compliance-controle van de kalender en controle van de site.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Kalender controleren
        run: npm run x:lint
      - name: Site controleren
        run: npm run site:check
