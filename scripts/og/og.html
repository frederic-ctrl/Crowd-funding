<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG Genesis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* 1200 x 630: de deelafbeelding van Marketing Scan Genesis voor X en andere sociale media */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #000; color: #f5f5f7; font-family: "Inter", system-ui, sans-serif; overflow: hidden; letter-spacing: -0.02em; }
  .wrap { box-sizing: border-box; width: 1200px; height: 630px; padding: 70px 76px; display: grid; grid-template-columns: 1fr 480px; gap: 56px; align-items: center; }
  .copy { display: flex; flex-direction: column; height: 100%; }
  .kicker { font-size: 26px; font-weight: 600; color: #a1a1a6; }
  h1 { margin: 26px 0 0; font-size: 84px; font-weight: 600; line-height: 1.02; letter-spacing: -0.05em; }
  .sub { margin-top: 26px; font-size: 27px; color: #f5f5f7; line-height: 1.3; }
  .bottom { margin-top: auto; font-size: 21px; color: #a1a1a6; }
  .card { position: relative; overflow: hidden; height: 302px; border-radius: 26px; padding: 30px 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;
    background: radial-gradient(130% 120% at 0% 0%, #3d3d42 0%, #18181b 46%, #060607 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(255,255,255,.06), 0 60px 100px -40px rgba(110,149,255,.35); transform: perspective(1200px) rotateY(-14deg) rotateX(6deg); }
  .card::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px); }
  .glare { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.14) 46%, transparent 60%); }
  .row { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; }
  .kind { font-size: 12px; font-weight: 600; letter-spacing: .28em; color: rgba(245,245,247,.58); }
  .num { position: relative; font-size: 82px; font-weight: 500; letter-spacing: -0.045em; line-height: .92; }
  .name { position: relative; font-size: 16px; color: rgba(245,245,247,.58); margin-top: 8px; font-weight: 500; }
  .meta { position: relative; display: flex; justify-content: space-between; font-size: 13px; color: rgba(245,245,247,.58); }
  .meta b { display: block; color: #f5f5f7; font-weight: 500; font-size: 15px; margin-top: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <div class="kicker">Marketing Scan Genesis</div>
      <h1>Pay once.<br>Use it forever.</h1>
      <div class="sub">Lifetime Marketing Scan Pro. 250 numbered passes, from €99. Soulbound on Solana.</div>
      <div class="bottom">community.marketingscan.be · Not an investment</div>
    </div>
    <div class="card">
      <div class="glare"></div>
      <div class="row">
        <span class="brand"><svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#2f5bea"/><path d="M6 12 H 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M6 8 H 13" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/><path d="M6 16 H 15" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/></svg>Marketing Scan</span>
        <span class="kind">GENESIS</span>
      </div>
      <div><div class="num">#001</div><div class="name">Genesis Pass</div></div>
      <div class="meta"><div>Holder<b>Your wallet</b></div><div style="text-align:right">Lifetime Pro<b>1 website</b></div></div>
    </div>
  </div>
</body>
</html>
