<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<title>OG community-ronde</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* 1200 x 630, in de stijl van de bestaande Marketing Scan-deelafbeelding */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f0ebe6; color: #111111; font-family: "Instrument Sans", system-ui, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px 64px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 22px; font-size: 34px; letter-spacing: -0.01em; }
  .pill { font-size: 24px; background: #c9e4a6; border: 2.5px solid #111111; border-radius: 999px; padding: 6px 22px; }
  h1 { margin: 110px 0 0; font-size: 76px; font-weight: 400; line-height: 1.08; letter-spacing: -0.02em; max-width: 1000px; }
  .sub { margin-top: 30px; font-size: 30px; color: #6f6a66; }
  .bottom { margin-top: auto; display: flex; align-items: center; gap: 20px; font-size: 26px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #f5693c; }
  .risk { margin-left: auto; font-size: 20px; color: #6f6a66; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><span>Marketing Scan</span><span class="pill">community-ronde</span></div>
    <h1>Word mede-eigenaar van Marketing Scan.</h1>
    <p class="sub">Vanaf €1 · je aandelen in je eigen wallet · alles live controleerbaar</p>
    <div class="bottom"><span class="dot"></span><span>community.marketingscan.be</span><span class="risk">Testnet-demo. Investeren houdt risico's in.</span></div>
  </div>
</body>
</html>
