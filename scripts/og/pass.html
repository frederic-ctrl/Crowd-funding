<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<title>Genesis-afbeelding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=Literata:opsz,wght@7..72,500&display=swap">
<style>
  /* 512 x 512: de afbeelding die wallets tonen bij een pass of badge. Variant via ?v=pass|agency|steun */
  html, body { margin: 0; background: transparent; }
  .tile { box-sizing: border-box; width: 512px; height: 512px; border-radius: 96px; padding: 56px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; position: relative;
    font-family: "Instrument Sans", system-ui, sans-serif; color: #f1f3fb; background: linear-gradient(150deg, #19234a 0%, #0b1024 55%, #070b1a 100%); }
  .glow { position: absolute; top: -160px; right: -140px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, var(--a), transparent 65%); opacity: 0.55; }
  .logo { position: relative; width: 84px; height: 84px; }
  .big { position: relative; align-self: center; font-family: "Literata", Georgia, serif; font-size: 112px; line-height: 1; letter-spacing: -0.02em; }
  .label { position: relative; font-size: 34px; font-weight: 700; letter-spacing: 0.14em; color: var(--a); }
</style>
</head>
<body>
  <div class="tile" id="tile">
    <div class="glow"></div>
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="7" fill="#2f5bea"/>
      <path d="M6 12 H 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M6 8 H 13" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
      <path d="M6 16 H 15" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="big" id="big">Genesis</div>
    <div class="label" id="label">PASS</div>
  </div>
  <script>
    const v = new URLSearchParams(location.search).get("v") || "pass";
    const conf = { pass: ["#7d99ff", "Genesis", "PASS"], agency: ["#c9e4a6", "Genesis", "AGENCY"], steun: ["#f5693c", "Supporter", "MARKETING SCAN"] }[v];
    document.getElementById("tile").style.setProperty("--a", conf[0]);
    document.getElementById("big").textContent = conf[1];
    document.getElementById("label").textContent = conf[2];
  </script>
</body>
</html>
